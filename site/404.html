<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Страница не найдена · Melo</title>
<link rel="icon" href="img/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f0d;
    --surface: #121815;
    --border: #1f2a24;
    --text: #edf2ee;
    --text-muted: #8e9f95;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 32px;
    max-width: 460px;
    width: 100%;
  }
  .code {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    background: var(--text);
    color: var(--bg);
    font-weight: 600;
    font-size: 14px;
    border-radius: var(--radius-sm);
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Запрашиваемый адрес не существует или был перемещён.</p>
    <a href="/" class="btn">На главную</a>
  </div>
</body>
</html>
